name: Build and deploy PanelProof

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write        # needed by "Persist newly fetched photos"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build site
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python build.py

      - name: Validate output
        run: python scripts/validate.py

      # Fetch each hero photo once, then commit it. Without this the runner
      # re-queries Pexels on every build and can return a different image for
      # the same article, so hero images drift and social preview caches go
      # stale. [skip ci] stops this commit from triggering another build.
      - name: Persist newly fetched photos
        run: |
          if [ -n "$(git status --porcelain assets/photos content/_data/photos.json)" ]; then
            git config user.name  "panelproof-bot"
            git config user.email "editor@panelproof.com"
            git add assets/photos content/_data/photos.json
            git commit -m "photos: cache newly fetched hero images [skip ci]"
            git push
          else
            echo "No new photos to persist."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
